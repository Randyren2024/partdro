<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Conceptual illustration of an agricultural multirotor drone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16233a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef7"/>
      <stop offset="1" stop-color="#9fb2c9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g stroke="#2b3c55" stroke-width="1" opacity="0.5">
    <path d="M0 640 H1200 M0 700 H1200"/>
  </g>
  <!-- arms -->
  <g stroke="#7d93ad" stroke-width="14" stroke-linecap="round">
    <line x1="600" y1="430" x2="420" y2="330"/>
    <line x1="600" y1="430" x2="780" y2="330"/>
    <line x1="600" y1="430" x2="420" y2="530"/>
    <line x1="600" y1="430" x2="780" y2="530"/>
  </g>
  <!-- rotors -->
  <g fill="none" stroke="#7fd1c1" stroke-width="5" opacity="0.85">
    <ellipse cx="420" cy="330" rx="130" ry="16"/>
    <ellipse cx="780" cy="330" rx="130" ry="16"/>
    <ellipse cx="420" cy="530" rx="130" ry="16"/>
    <ellipse cx="780" cy="530" rx="130" ry="16"/>
  </g>
  <g fill="#4d9be6" opacity="0.75">
    <circle cx="420" cy="330" r="14"/>
    <circle cx="780" cy="330" r="14"/>
    <circle cx="420" cy="530" r="14"/>
    <circle cx="780" cy="530" r="14"/>
  </g>
  <!-- fuselage -->
  <rect x="510" y="380" width="180" height="100" rx="26" fill="url(#body)" stroke="#7d93ad" stroke-width="3"/>
  <!-- tanks -->
  <rect x="470" y="500" width="120" height="70" rx="18" fill="#c7d4e3" stroke="#7d93ad" stroke-width="3"/>
  <rect x="610" y="500" width="120" height="70" rx="18" fill="#b9c8da" stroke="#7d93ad" stroke-width="3"/>
  <!-- nozzles -->
  <g stroke="#7fd1c1" stroke-width="5" stroke-linecap="round">
    <line x1="430" y1="575" x2="430" y2="615"/>
    <line x1="500" y1="575" x2="500" y2="625"/>
    <line x1="700" y1="575" x2="700" y2="625"/>
    <line x1="770" y1="575" x2="770" y2="615"/>
  </g>
  <g fill="#7fd1c1" opacity="0.18">
    <path d="M400 640 H800 L860 720 H340 Z"/>
  </g>
  <g fill="#9fb2c9" font-family="Inter, system-ui, sans-serif" font-size="26">
    <text x="72" y="110" fill="#e8eef7" font-size="34" font-weight="600">A80</text>
    <text x="72" y="150">Agricultural drone</text>
    <text x="72" y="760" font-size="20" opacity="0.7">Conceptual illustration — not a photograph of the aircraft</text>
  </g>
</svg>
