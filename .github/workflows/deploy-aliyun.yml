name: Deploy to Aliyun (OSS + FC)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (prerender)
        run: npx playwright install --with-deps chromium

      - name: Build site
        env:
          VITE_API_BASE: ${{ secrets.ALIYUN_FC_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install Aliyun CLI
        run: |
          curl -sL https://github.com/aliyun/aliyun-cli/releases/download/v3.5.1/aliyun-cli-linux-3.5.1-amd64.tgz -o /tmp/aliyun-cli.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo install /tmp/aliyun /usr/local/bin/aliyun
          aliyun configure set --mode AK \
            --access-key-id "${{ secrets.ALIYUN_AK }}" \
            --access-key-secret "${{ secrets.ALIYUN_SK }}" \
            --region cn-hongkong

      - name: Sync dist to OSS
        run: |
          # 不使用 --delete：aliyun oss sync 的 --exclude 不支持带目录的 pattern
          # （报 "does not support format containing dir info"），而 bucket 里
          # 同时存放运维产物（ads-reports/ gsc-reports/ gsc-deep-analysis/ fc/），
          # 全量 --delete 会把它们一并清掉。代价是旧 assets 残留，按需手动清理。
          aliyun oss sync dist/ "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/" \
            -e oss-cn-hongkong.aliyuncs.com -f

      - name: Build FC bundle
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          node scripts/build-fc.mjs
          (cd dist-fc && zip -q -r fc-code.zip index.js)
          aliyun oss cp dist-fc/fc-code.zip \
            "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/fc-code.zip" \
            -e oss-cn-hongkong.aliyuncs.com -f

      - name: Deploy FC function code
        run: |
          for i in 1 2 3 4 5; do
            if aliyun fc PUT "/2023-03-30/functions/${{ secrets.ALIYUN_FC_FUNCTION }}" \
              --region cn-hongkong \
              --header "Content-Type=application/json" \
              --read-timeout 120 \
              --connect-timeout 30 \
              --body "{\"code\":{\"ossBucketName\":\"${{ secrets.ALIYUN_OSS_BUCKET }}\",\"ossObjectName\":\"fc-code.zip\"}}"; then
              echo "FC code deployed (attempt $i)"
              exit 0
            fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "FC code deploy failed after 5 attempts"
          exit 1

      # 三个日报函数（GSC / Ads / 深度分析）不在上面的静态站点流程里。
      # 脚本只重新打包 + 上传代码 + 合并飞书凭据，函数已有的 GSC/Ads/E2B/DirectMail
      # 环境变量原样保留——所以 CI 不需要这些密钥，只要阿里云 AK 与桶名。
      - name: Deploy report functions (GSC / Ads / Deep)
        env:
          OSS_AK_ID: ${{ secrets.ALIYUN_AK }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_SK }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: cn-hongkong
        run: node scripts/deploy-report-fns.mjs
