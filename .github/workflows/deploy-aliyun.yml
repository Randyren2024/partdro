name: Deploy to Aliyun (OSS + FC)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (prerender)
        run: npx playwright install --with-deps chromium

      - name: Build site
        env:
          VITE_API_BASE: ${{ secrets.ALIYUN_FC_API_URL }}
        run: npm run build

      - name: Install Aliyun CLI
        run: |
          curl -sL https://github.com/aliyun/aliyun-cli/releases/download/v3.5.1/aliyun-cli-linux-3.5.1.tgz -o /tmp/aliyun-cli.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo install /tmp/aliyun /usr/local/bin/aliyun
          aliyun configure --mode AK \
            --aki "${{ secrets.ALIYUN_AK }}" \
            --skey "${{ secrets.ALIYUN_SK }}" \
            --region cn-hongkong

      - name: Install ossutil
        run: |
          curl -sL https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64 -o /tmp/ossutil64
          chmod +x /tmp/ossutil64
          /tmp/ossutil64 config -e oss-cn-hongkong.aliyuncs.com \
            -i "${{ secrets.ALIYUN_AK }}" -k "${{ secrets.ALIYUN_SK }}" -f

      - name: Build FC bundle
        run: |
          node scripts/build-fc.mjs
          (cd dist-fc && zip -q -r fc-code.zip index.js)
          /tmp/ossutil64 cp dist-fc/fc-code.zip "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/fc-code.zip" --force

      - name: Sync dist to OSS
        run: |
          /tmp/ossutil64 sync dist/ "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/" --delete --force

      - name: Deploy FC function code
        run: |
          aliyun fc PUT "/2023-03-30/functions/${{ secrets.ALIYUN_FC_FUNCTION }}" \
            --region cn-hongkong \
            --header "Content-Type=application/json" \
            --body "{\"code\":{\"ossBucketName\":\"${{ secrets.ALIYUN_OSS_BUCKET }}\",\"ossObjectName\":\"fc-code.zip\"}}"
