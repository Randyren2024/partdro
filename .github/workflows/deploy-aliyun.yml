name: Deploy to Aliyun (OSS + FC)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (prerender)
        run: npx playwright install --with-deps chromium

      - name: Build site
        env:
          VITE_API_BASE: ${{ secrets.ALIYUN_FC_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Install Aliyun CLI
        run: |
          curl -sL https://github.com/aliyun/aliyun-cli/releases/download/v3.5.1/aliyun-cli-linux-3.5.1-amd64.tgz -o /tmp/aliyun-cli.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo install /tmp/aliyun /usr/local/bin/aliyun
          aliyun configure set --mode AK \
            --access-key-id "${{ secrets.ALIYUN_AK }}" \
            --access-key-secret "${{ secrets.ALIYUN_SK }}" \
            --region cn-hongkong

      - name: Sync dist to OSS
        run: |
          aliyun oss sync dist/ "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/" \
            --delete -e oss-cn-hongkong.aliyuncs.com -f

      - name: Build FC bundle
        run: |
          node scripts/build-fc.mjs
          (cd dist-fc && zip -q -r fc-code.zip index.js)
          aliyun oss cp dist-fc/fc-code.zip \
            "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/fc-code.zip" \
            -e oss-cn-hongkong.aliyuncs.com -f

      - name: Deploy FC function code
        run: |
          for i in 1 2 3 4 5; do
            if aliyun fc PUT "/2023-03-30/functions/${{ secrets.ALIYUN_FC_FUNCTION }}" \
              --region cn-hongkong \
              --header "Content-Type=application/json" \
              --read-timeout 120 \
              --connect-timeout 30 \
              --body "{\"code\":{\"ossBucketName\":\"${{ secrets.ALIYUN_OSS_BUCKET }}\",\"ossObjectName\":\"fc-code.zip\"}}"; then
              echo "FC code deployed (attempt $i)"
              exit 0
            fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "FC code deploy failed after 5 attempts"
          exit 1
