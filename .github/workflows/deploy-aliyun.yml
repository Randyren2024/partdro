name: Deploy to Aliyun (OSS + FC)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aliyun
  cancel-in-progress: false

jobs:
  deploy:
    # 不要用 ubuntu-latest：2026-10 起它迁移到 Ubuntu 26.04，
    # Playwright 1.60 不支持该发行版，`playwright install --with-deps` 会直接失败。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (prerender)
        run: npx playwright install --with-deps chromium

      - name: Build site
        env:
          VITE_API_BASE: ${{ secrets.ALIYUN_FC_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # 独立的 C500 EAVision 静态落地页（四语种）：不参与主站 175 页预渲染，
      # 构建后覆盖主站同名路由，再由下面的守卫确保没有被空壳覆盖。
      - name: Build C500 landing (4 locales)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run landing:c500:build

      - name: Merge C500 landing and guard
        run: |
          cp -R dist-landing/c500/site/. dist/
          for page in \
            dist/products/c500-partdro-eavision/index.html \
            dist/es/products/c500-partdro-eavision/index.html \
            dist/de/products/c500-partdro-eavision/index.html \
            dist/fr/products/c500-partdro-eavision/index.html; do
            if [ ! -f "$page" ]; then
              echo "missing C500 landing page: $page"
              exit 1
            fi
            for needle in 'id="c500-quote"' 'GTM-KJ7GJ3V5' 'hreflang="x-default"'; do
              if ! grep -q "$needle" "$page"; then
                echo "$page is missing $needle (was the main build merged over the landing?)"
                exit 1
              fi
            done
            echo "guard ok: $page"
          done

      # 独立的 U15 多任务无人机静态落地页（英语、西语、德语、法语）。
      - name: Build U15 landing (4 locales)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run landing:u15:build

      - name: Merge U15 landing and guard (4 locales)
        run: |
          cp -R dist-landing/u15/site/. dist/
          for locale in en es de fr; do
            if [ "$locale" = "en" ]; then
              page=dist/products/u15-multi-mission-drone/index.html
            else
              page=dist/$locale/products/u15-multi-mission-drone/index.html
            fi
            if [ ! -f "$page" ]; then
              echo "missing U15 landing page: $page"
              exit 1
            fi
            for needle in 'id="u15-quote"' 'GTM-KJ7GJ3V5' 'u15-multi-mission-drone/images/hero.webp' 'hreflang="x-default"'; do
              if ! grep -q "$needle" "$page"; then
                echo "$page is missing $needle (was the main build merged over the landing?)"
                exit 1
              fi
            done
            echo "guard ok: $page"
          done

      # 独立的 VF50P 长航时 VTOL 固定翼无人机静态落地页（英语、西语、德语、法语）。
      - name: Build VF50P landing (4 locales)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run landing:vf50p:build

      - name: Merge VF50P landing and guard (4 locales)
        run: |
          cp -R dist-landing/vf50p/site/. dist/
          for locale in en es de fr; do
            if [ "$locale" = "en" ]; then
              page=dist/products/vf50p-long-endurance-vtol-uav/index.html
            else
              page=dist/$locale/products/vf50p-long-endurance-vtol-uav/index.html
            fi
            if [ ! -f "$page" ]; then
              echo "missing VF50P landing page: $page"
              exit 1
            fi
            for needle in 'id="vf50p-quote"' 'GTM-KJ7GJ3V5' 'images/vf50p/hero-vf50p.webp' 'hreflang="x-default"'; do
              if ! grep -q "$needle" "$page"; then
                echo "$page is missing $needle (was the main build merged over the landing?)"
                exit 1
              fi
            done
            echo "guard ok: $page"
          done

      - name: Install Aliyun CLI
        run: |
          curl -sL https://github.com/aliyun/aliyun-cli/releases/download/v3.5.1/aliyun-cli-linux-3.5.1-amd64.tgz -o /tmp/aliyun-cli.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo install /tmp/aliyun /usr/local/bin/aliyun
          aliyun configure set --mode AK \
            --access-key-id "${{ secrets.ALIYUN_AK }}" \
            --access-key-secret "${{ secrets.ALIYUN_SK }}" \
            --region cn-hongkong

      - name: Sync dist to OSS
        run: |
          # 不使用 --delete：aliyun oss sync 的 --exclude 不支持带目录的 pattern
          # （报 "does not support format containing dir info"），而 bucket 里
          # 同时存放运维产物（ads-reports/ gsc-reports/ gsc-deep-analysis/ fc/），
          # 全量 --delete 会把它们一并清掉。代价是旧 assets 残留，按需手动清理。
          aliyun oss sync dist/ "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/" \
            -e oss-cn-hongkong.aliyuncs.com -f

      - name: Build FC bundle
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          node scripts/build-fc.mjs
          (cd dist-fc && zip -q -r fc-code.zip index.js)
          aliyun oss cp dist-fc/fc-code.zip \
            "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/fc-code.zip" \
            -e oss-cn-hongkong.aliyuncs.com -f

      - name: Deploy FC function code
        run: |
          for i in 1 2 3 4 5; do
            if aliyun fc PUT "/2023-03-30/functions/${{ secrets.ALIYUN_FC_FUNCTION }}" \
              --region cn-hongkong \
              --header "Content-Type=application/json" \
              --read-timeout 120 \
              --connect-timeout 30 \
              --body "{\"code\":{\"ossBucketName\":\"${{ secrets.ALIYUN_OSS_BUCKET }}\",\"ossObjectName\":\"fc-code.zip\"}}"; then
              echo "FC code deployed (attempt $i)"
              exit 0
            fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "FC code deploy failed after 5 attempts"
          exit 1

      # 三个日报函数（GSC / Ads / 深度分析）不在上面的静态站点流程里。
      # 脚本只重新打包 + 上传代码 + 合并飞书凭据，函数已有的 GSC/Ads/E2B/DirectMail
      # 环境变量原样保留——所以 CI 不需要这些密钥，只要阿里云 AK 与桶名。
      - name: Deploy report functions (GSC / Ads / Deep)
        env:
          OSS_AK_ID: ${{ secrets.ALIYUN_AK }}
          OSS_AK_SECRET: ${{ secrets.ALIYUN_SK }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: cn-hongkong
        run: node scripts/deploy-report-fns.mjs
