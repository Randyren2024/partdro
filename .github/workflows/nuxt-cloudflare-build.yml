name: Nuxt Cloudflare Pages Build and PR Preview

on:
  # Live Cloudflare Preview is opt-in: add the "preview-required" PR label
  # only for routing, data, form, or deployment-sensitive changes.
  pull_request:
    types: [labeled]
    paths:
      - "app/**"
      - "server/**"
      - "public/**"
      - "nuxt.config.ts"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/nuxt-cloudflare-build.yml"
      - ".github/workflows/validate-nuxt.yml"
      - ".github/workflows/deploy-cloudflare.yml"

concurrency:
  group: nuxt-cloudflare-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT_NAME: partdro-nuxt
  CF_ACCOUNT_ID: f7baff0f09564f34ec470d7f7d0ce474

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'preview-required')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Build for Cloudflare Pages
        env:
          NITRO_PRESET: cloudflare_pages
        run: npm run generate

      - name: Verify Cloudflare Pages artifacts and localized routes
        run: |
          set -euo pipefail
          test -s dist/index.html
          HTML_COUNT=$(find dist -type f -name '*.html' | wc -l)
          echo "HTML files: ${HTML_COUNT}"
          # The current Nuxt output contains 86 HTML documents (172 prerendered
          # routes also include payload JSON). Keep a floor below the observed
          # count and assert representative localized routes explicitly.
          if [ "${HTML_COUNT}" -lt 80 ]; then
            echo "::error::Only ${HTML_COUNT} HTML files generated; expected at least 80."
            exit 1
          fi
          for route in products products/d15r de/products es/products fr/products; do
            if [ ! -s "dist/${route}/index.html" ]; then
              echo "::error::Missing generated route: ${route}"
              exit 1
            fi
          done
          for artifact in _routes.json _headers _redirects; do
            if [ ! -s "dist/${artifact}" ]; then
              echo "::error::dist/${artifact} is missing or empty."
              exit 1
            fi
          done
          echo "Cloudflare Pages build artifacts verified."

      - name: Compress oversized media for Cloudflare Pages
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-required')
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          found=0
          while IFS= read -r f; do
            found=1
            echo "compressing $f ($(du -m "$f" | cut -f1) MiB)"
            ffmpeg -nostdin -loglevel error -i "$f" -c:v libx264 -preset veryfast -crf 24 \
              -c:a aac -b:a 128k -fs 23M -y "$f.tmp.mp4"
            mv "$f.tmp.mp4" "$f"
          done < <(find dist -type f \( -name '*.mp4' -o -name '*.mov' \) -size +24M)
          if [ "$found" = 0 ]; then echo "no oversized media found"; fi
          oversized=$(find dist -type f -size +24M | head -20)
          if [ -n "$oversized" ]; then
            echo "::error::Files still exceed Cloudflare Pages 25 MiB limit:"
            echo "$oversized"
            exit 1
          fi

      - name: Check Cloudflare preview credentials
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-required')
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Cloudflare Pages Edit permission."
            exit 1
          fi

      - name: Explain skipped preview for low-risk changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'preview-required')
        run: |
          {
            echo "## Cloudflare Preview skipped"
            echo ""
            echo "This PR passed the static build and artifact checks. A live Preview is reserved for PRs labeled `preview-required` (for example, routing, data, forms, or deployment changes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy PR preview to Cloudflare Pages
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-required')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -o pipefail
          PREVIEW_BRANCH="pr-${{ github.event.pull_request.number }}"
          npx wrangler pages deploy dist \
            --project-name "${{ env.CF_PROJECT_NAME }}" \
            --branch "$PREVIEW_BRANCH" \
            --commit-dirty=true 2>&1 | tee deploy.log
          PREVIEW_URL="https://${PREVIEW_BRANCH}.${{ env.CF_PROJECT_NAME }}.pages.dev"
          {
            echo "## Cloudflare Pages PR Preview"
            echo ""
            echo "**Preview branch:** `$PREVIEW_BRANCH`"
            echo ""
            echo "**Preview URL:** $PREVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Preview URL: $PREVIEW_URL"
