name: Nuxt Cloudflare Pages Build

on:
  pull_request:
    paths:
      - "nuxt-app/**"
      - ".github/workflows/nuxt-cloudflare-build.yml"
  push:
    branches: [main]
    paths:
      - "nuxt-app/**"
      - ".github/workflows/nuxt-cloudflare-build.yml"

concurrency:
  group: nuxt-cloudflare-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nuxt-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuxt-app/package-lock.json

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Build for Cloudflare Pages
        env:
          NITRO_PRESET: cloudflare_pages
        run: npm run generate

      - name: Verify Cloudflare Pages artifacts
        run: |
          test -s dist/index.html
          HTML_COUNT=$(find dist -name '*.html' | wc -l)
          echo "HTML files: $HTML_COUNT"
          if [ "$HTML_COUNT" -lt 100 ]; then
            echo "::error::Too few prerendered pages; expected at least 100."
            exit 1
          fi
          for artifact in _routes.json _headers _redirects; do
            if [ ! -s "dist/$artifact" ]; then
              echo "::error::dist/$artifact is missing or empty."
              exit 1
            fi
          done
          echo "Cloudflare Pages build artifacts verified."
