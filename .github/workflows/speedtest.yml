name: speed test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Measure site speed from US
        run: |
          echo "=== TTFB main page ==="
          curl -sS -o /dev/null -w "dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}B http=%{http_code}\n" https://www.droneworld.tech/ --max-time 60
          echo "=== large image 4.4MB ==="
          curl -sS -o /dev/null -w "ttfb=%{time_starttransfer}s total=%{time_total}s speed=%{speed_download}B/s size=%{size_download}B http=%{http_code}\n" https://www.droneworld.tech/images/c500-delivery-drone/cluster-quad.png --max-time 120
          echo "=== small asset css ==="
          CSS=$(curl -sS https://www.droneworld.tech/ --max-time 60 | grep -o '/assets/[^"]*\.css' | head -1)
          echo "asset: $CSS"
          curl -sS -o /dev/null -w "ttfb=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n" "https://www.droneworld.tech$CSS" --max-time 60
          echo "=== sitemap via FC ==="
          curl -sS -o /dev/null -w "ttfb=%{time_starttransfer}s total=%{time_total}s http=%{http_code}\n" https://partdro-api-dbpdmpweut.cn-hongkong.fcapp.run/sitemap.xml --max-time 60
