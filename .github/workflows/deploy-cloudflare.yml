name: Deploy Nuxt 4 to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CF_PROJECT_NAME: partdro-nuxt
  CF_ACCOUNT_ID: f7baff0f09564f34ec470d7f7d0ce474 # Partdro2023@gmail.com's Account

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Only the Cloudflare token is a hard requirement. The Supabase URL and
          # anon key are public values with build-time defaults in nuxt.config.ts,
          # so a stale/missing copy here is a warning, not a failure.
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "preflight ok"

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.161 requires Node >= 22.12; Node 20 makes it refuse to run.
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          # Use `npm install`, not `npm ci`. The lockfile was generated on Windows
          # and hoists esbuild to 0.25.12 while nested copies sit at 0.28.2; on
          # Linux `npm ci` recomputes a different hoisting and aborts with
          # "Missing: @esbuild/linux-x64@0.28.2 from lock file".
          npm install --include=optional --no-audit --no-fund

      - name: Build Nuxt app with Cloudflare Pages server runtime
        env:
          NITRO_PRESET: cloudflare_pages
        run: npm run build

      # VF50P and U15 retain their original Vite media pipelines; Nuxt renders all three premium product HTML routes.
      - name: Install original landing-page dependencies
        working-directory: .
        run: npm install --include=optional --no-audit --no-fund

      - name: Install Chromium for landing-page prerender
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Build the three premium product landing pages
        working-directory: .
        run: |
          npm run landing:vf50p:build
          npm run landing:u15:build

      - name: Merge premium landing pages into Nuxt output
        working-directory: .
        run: |
          set -euo pipefail
          test -s dist-landing/vf50p/site/products/vf50p-long-endurance-vtol-uav/index.html
          test -s dist-landing/u15/site/products/u15-multi-mission-drone/index.html
          # Keep original VF50P and U15 media, but let Nuxt own both HTML routes.
          mkdir -p dist/products/vf50p-long-endurance-vtol-uav/images dist/products/vf50p-long-endurance-vtol-uav/video
          cp -a dist-landing/vf50p/site/products/vf50p-long-endurance-vtol-uav/images/. dist/products/vf50p-long-endurance-vtol-uav/images/
          cp -a dist-landing/vf50p/site/products/vf50p-long-endurance-vtol-uav/video/. dist/products/vf50p-long-endurance-vtol-uav/video/
          mkdir -p dist/products/u15-multi-mission-drone/images dist/products/u15-multi-mission-drone/video
          cp -a dist-landing/u15/site/products/u15-multi-mission-drone/images/. dist/products/u15-multi-mission-drone/images/
          cp -a dist-landing/u15/site/products/u15-multi-mission-drone/video/. dist/products/u15-multi-mission-drone/video/
          echo "Premium product landing pages merged into dist"

      - name: Compress oversized media (Cloudflare Pages 25 MiB per-file limit)
        run: |
          # Source videos in public/ exceed 25 MiB; Cloudflare Pages rejects the
          # whole upload if any single file is larger. Compress in CI only, so
          # git never has to carry the extra blobs.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          found=0
          while IFS= read -r f; do
            found=1
            echo "compressing $f ($(du -m "$f" | cut -f1) MiB)"
            # -nostdin is required: without it ffmpeg eats the loop's stdin
            # (the find output) and only the first file ever gets processed.
            ffmpeg -nostdin -loglevel error -i "$f" -c:v libx264 -preset veryfast -crf 24 \
              -c:a aac -b:a 128k -fs 23M -y "$f.tmp.mp4"
            mv "$f.tmp.mp4" "$f"
            echo "  -> $(du -m "$f" | cut -f1) MiB"
          done < <(find dist -type f \( -name '*.mp4' -o -name '*.mov' \) -size +24M)
          if [ "$found" = 0 ]; then echo "no oversized media found"; fi
          # Hard gate: nothing over 24 MiB may remain (Cloudflare limit is 25 MiB).
          oversized=$(find dist -type f -size +24M | head -20)
          if [ -n "$oversized" ]; then
            echo "FAIL: files still exceed 24 MiB:"; echo "$oversized"; exit 1
          fi

      - name: Verify build output
        run: |
          # Nuxt currently emits 86 HTML documents; assert a conservative floor and key localized routes.
          set -euo pipefail
          test -s dist/index.html
          HTML_COUNT=$(find dist -type f -name '*.html' | wc -l)
          echo "HTML files: $HTML_COUNT (expected at least 80)"
          if [ "$HTML_COUNT" -lt 80 ]; then
            echo "FAIL: too few HTML files — prerender may have failed"
            exit 1
          fi
          for route in products products/d15r de/products es/products fr/products; do
            if [ ! -s "dist/${route}/index.html" ]; then
              echo "FAIL: missing generated route: ${route}"
              exit 1
            fi
          done
          # Verify the actual prerendered header labels, not just that locale routes exist.
          for check in "de:Kontakt" "es:Contáctenos" "fr:Contactez-Nous"; do
            locale="${check%%:*}"
            label="${check#*:}"
            html="dist/${locale}/contact/index.html"
            if ! grep -Fq "${label}" "${html}"; then
              echo "FAIL: expected localized contact label '${label}' in ${html}"
              exit 1
            fi
            if grep -Fq "nav.contact" "${html}"; then
              echo "FAIL: raw i18n key nav.contact leaked into ${html}"
              exit 1
            fi
            echo "verified ${locale} navigation label: ${label}"
          done
          # The three bespoke Vue/Vite landing pages must exist in all four locales.
          for locale in en es de fr; do
            prefix=""
            if [ "$locale" != "en" ]; then prefix="$locale/"; fi
            for slug in c500-partdro-eavision vf50p-long-endurance-vtol-uav u15-multi-mission-drone; do
              route="dist/${prefix}products/${slug}/index.html"
              if [ ! -s "$route" ]; then
                echo "FAIL: missing premium landing page: $route"
                exit 1
              fi
              echo "verified $route"
            done
          done
          # C500 is now a Nuxt-rendered route: verify real SSR content and localized metadata.
          for locale in en es de fr; do
            prefix=""
            if [ "$locale" != "en" ]; then prefix="$locale/"; fi
            html="dist/${prefix}products/c500-partdro-eavision/index.html"
            grep -Fq 'id="c500-quote"' "$html"
            grep -Fq 'C500' "$html"
            assert_html_contains "$html" 'hreflang="x-default"' "x-default hreflang"
            echo "verified Nuxt-rendered C500 SEO and quote form: $html"
          done
          # All three Nuxt-rendered product pages must contain their own SSR form,
          # localized document metadata, complete SEO graph and the expected schema types.
          assert_html_language() {
            local html_file="$1"
            local locale="$2"
            local allowed
            case "$locale" in
              en) allowed='en|en-US' ;;
              de) allowed='de|de-DE' ;;
              es) allowed='es|es-ES' ;;
              fr) allowed='fr|fr-FR' ;;
              *) echo "::error::Unknown locale $locale"; exit 1 ;;
            esac
            if ! grep -Eq "<html[^>]*lang=\"($allowed)\"" "$html_file"; then
              echo "::error::Missing expected html lang for $locale in $html_file"
              grep -oE '<html[^>]*>' "$html_file" | head -n 1 || true
              exit 1
            fi
          }
          assert_html_contains() {
            local html_file="$1"
            local expected="$2"
            local label="$3"
            if ! grep -Fq "$expected" "$html_file"; then
              echo "::error::Missing $label ($expected) in $html_file"
              exit 1
            fi
          }
          declare -A form_ids=(
            [c500-partdro-eavision]="c500-quote"
            [vf50p-long-endurance-vtol-uav]="vf50p-quote"
            [u15-multi-mission-drone]="u15-quote"
          )
          for locale in en es de fr; do
            prefix=""
            if [ "$locale" != "en" ]; then prefix="$locale/"; fi
            for slug in c500-partdro-eavision vf50p-long-endurance-vtol-uav u15-multi-mission-drone; do
              html="dist/${prefix}products/${slug}/index.html"
              assert_html_contains "$html" "<html lang=\"$locale\"" "document language"
              assert_html_contains "$html" "id=\"${form_ids[$slug]}\"" "product quote form"
              assert_html_contains "$html" 'hreflang="x-default"' "x-default hreflang"
              assert_html_contains "$html" 'og:image:alt' "Open Graph image alt"
              assert_html_contains "$html" 'og:image:secure_url' "Open Graph secure image"
              assert_html_contains "$html" 'og:image:width' "Open Graph image width"
              assert_html_contains "$html" 'og:image:height' "Open Graph image height"
              assert_html_contains "$html" 'og:locale:alternate' "alternate Open Graph locale"
              assert_html_contains "$html" 'twitter:image:alt' "Twitter image alt"
              assert_html_contains "$html" 'application/ld+json' "structured data"
              assert_html_contains "$html" '"@type":"Product"' "Product schema"
              assert_html_contains "$html" '"@id":"https://www.droneworld.tech/#organization"' "Organization schema"
              if [ "$slug" != "c500-partdro-eavision" ]; then
                assert_html_contains "$html" '"@type":"FAQPage"' "FAQPage schema"
              fi
              echo "verified Nuxt SSR form, locale and SEO schema: $html"
            done
          done
          for artifact in _routes.json _headers _redirects; do
            if [ ! -f "dist/$artifact" ]; then
              echo "FAIL: dist/$artifact missing (cloudflare_pages preset should generate it)"
              exit 1
            fi
          done
          # Nitro currently appends every prerendered path to _routes.json exclude.
          # Cloudflare Pages limits route rules to 100 chars and 100 entries.
          # Rewrite the final manifest after all static assets/pages are merged:
          # only API requests invoke the Worker; Pages serves all other files.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'dist/_routes.json'
          const routes = JSON.parse(readFileSync(file, 'utf8'))
          if (routes.version !== 1) throw new Error('Unsupported _routes.json version')
          routes.include = ['/api/*']
          routes.exclude = []
          const rules = [...routes.include, ...routes.exclude]
          const tooLong = rules.filter(rule => rule.length > 100)
          if (tooLong.length) throw new Error(`Cloudflare route rules exceed 100 chars: ${tooLong.join(', ')}`)
          if (rules.length > 100) throw new Error(`Cloudflare route rule count exceeds 100: ${rules.length}`)
          writeFileSync(file, JSON.stringify(routes, null, 2) + '\n')
          const verified = JSON.parse(readFileSync(file, 'utf8'))
          if (JSON.stringify(verified.include) !== JSON.stringify(['/api/*']) || verified.exclude.length !== 0) {
            throw new Error('Failed to normalize Cloudflare Pages routes manifest')
          }
          console.log('Normalized Cloudflare Pages routes: only /api/* invokes the Worker')
          NODE
          # Static generate omits Nitro server routes; require the Pages Worker.
          if [ ! -e "dist/_worker.js" ]; then
            echo "FAIL: dist/_worker.js missing — server API routes would return 404"
            exit 1
          fi
          echo "Cloudflare Pages Worker present"
          echo "build artifact check passed"

      - name: Smoke-test server API with local Cloudflare Pages runtime
        run: |
          set -euo pipefail
          npx wrangler pages dev dist --ip 127.0.0.1 --port 8788 > /tmp/partdro-pages-dev.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          STATUS=""
          for attempt in $(seq 1 30); do
            STATUS=$(curl --silent --output /tmp/partdro-inquiry-response.json --write-out '%{http_code}' \
              --request POST http://127.0.0.1:8788/api/inquiry \
              --header 'Content-Type: application/json' \
              --data '{}' || true)
            if [ "$STATUS" = "400" ]; then
              echo "PASS: /api/inquiry is served by the Pages Worker and validates the request"
              exit 0
            fi
            if [ -n "$STATUS" ] && [ "$STATUS" != "000" ] && [ "$STATUS" != "404" ]; then
              echo "FAIL: /api/inquiry returned unexpected HTTP $STATUS"
              cat /tmp/partdro-inquiry-response.json || true
              cat /tmp/partdro-pages-dev.log || true
              exit 1
            fi
            if ! kill -0 "$WRANGLER_PID" 2>/dev/null; then
              echo "FAIL: Wrangler Pages runtime exited before becoming ready"
              cat /tmp/partdro-pages-dev.log || true
              exit 1
            fi
            sleep 2
          done
          echo "FAIL: /api/inquiry did not become available (last HTTP status: ${STATUS:-none})"
          cat /tmp/partdro-pages-dev.log || true
          exit 1

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          # pipefail is essential: `| tee` otherwise makes the step exit with tee's
          # status (0) and hides a wrangler failure — a run can look green while
          # nothing was deployed.
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name "${{ env.CF_PROJECT_NAME }}" \
            --branch "main" \
            --commit-dirty=true 2>&1 | tee deploy.log

      - name: Report deployment URL
        if: always()
        run: |
          # Pull the *.pages.dev URL out of wrangler's own output.
          URL=$(grep -oE 'https://[a-z0-9-]+\.'${{ env.CF_PROJECT_NAME }}'\.pages\.dev' deploy.log | tail -n1 || true)
          echo "Deployment URL: ${URL:-<not found in deploy.log>}"
          if [ -n "$URL" ]; then
            echo "### Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          fi
