name: Deploy Nuxt 4 to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CF_PROJECT_NAME: partdro-nuxt
  CF_ACCOUNT_ID: f7baff0f09564f34ec470d7f7d0ce474 # Partdro2023@gmail.com's Account

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nuxt-app

    steps:
      - uses: actions/checkout@v4

      - name: Preflight — required secrets present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Only the Cloudflare token is a hard requirement. The Supabase URL and
          # anon key are public values with build-time defaults in nuxt.config.ts,
          # so a stale/missing copy here is a warning, not a failure.
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "preflight ok"

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.161 requires Node >= 22.12; Node 20 makes it refuse to run.
          node-version: 22
          cache: npm
          cache-dependency-path: nuxt-app/package-lock.json

      - name: Install dependencies
        run: |
          # Use `npm install`, not `npm ci`. The lockfile was generated on Windows
          # and hoists esbuild to 0.25.12 while nested copies sit at 0.28.2; on
          # Linux `npm ci` recomputes a different hoisting and aborts with
          # "Missing: @esbuild/linux-x64@0.28.2 from lock file".
          npm install --include=optional --no-audit --no-fund

      - name: Build Nuxt static site (Cloudflare Pages preset)
        env:
          NITRO_PRESET: cloudflare_pages
        run: npm run generate

      # These three product pages are intentionally bespoke Vue 3 + Vite
      # experiences. Build them from their original sources and merge their
      # static output into Nuxt's generated site; do not replace them with the
      # generic Nuxt product detail template.
      - name: Install original landing-page dependencies
        working-directory: .
        run: npm install --include=optional --no-audit --no-fund

      - name: Install Chromium for landing-page prerender
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Build the three premium product landing pages
        working-directory: .
        run: |
          npm run landing:c500:build
          npm run landing:vf50p:build
          npm run landing:u15:build

      - name: Merge premium landing pages into Nuxt output
        working-directory: .
        run: |
          set -euo pipefail
          test -s dist-landing/c500/site/products/c500-partdro-eavision/index.html
          test -s dist-landing/vf50p/site/products/vf50p-long-endurance-vtol-uav/index.html
          test -s dist-landing/u15/site/products/u15-multi-mission-drone/index.html
          cp -a dist-landing/c500/site/. nuxt-app/dist/
          cp -a dist-landing/vf50p/site/. nuxt-app/dist/
          cp -a dist-landing/u15/site/. nuxt-app/dist/
          echo "Premium product landing pages merged into nuxt-app/dist"

      - name: Compress oversized media (Cloudflare Pages 25 MiB per-file limit)
        run: |
          # Source videos in public/ exceed 25 MiB; Cloudflare Pages rejects the
          # whole upload if any single file is larger. Compress in CI only, so
          # git never has to carry the extra blobs.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          found=0
          while IFS= read -r f; do
            found=1
            echo "compressing $f ($(du -m "$f" | cut -f1) MiB)"
            # -nostdin is required: without it ffmpeg eats the loop's stdin
            # (the find output) and only the first file ever gets processed.
            ffmpeg -nostdin -loglevel error -i "$f" -c:v libx264 -preset veryfast -crf 24 \
              -c:a aac -b:a 128k -fs 23M -y "$f.tmp.mp4"
            mv "$f.tmp.mp4" "$f"
            echo "  -> $(du -m "$f" | cut -f1) MiB"
          done < <(find dist -type f \( -name '*.mp4' -o -name '*.mov' \) -size +24M)
          if [ "$found" = 0 ]; then echo "no oversized media found"; fi
          # Hard gate: nothing over 24 MiB may remain (Cloudflare limit is 25 MiB).
          oversized=$(find dist -type f -size +24M | head -20)
          if [ -n "$oversized" ]; then
            echo "FAIL: files still exceed 24 MiB:"; echo "$oversized"; exit 1
          fi

      - name: Verify build output
        run: |
          # Nuxt currently emits 86 HTML documents; assert a conservative floor and key localized routes.
          set -euo pipefail
          test -s dist/index.html
          HTML_COUNT=$(find dist -type f -name '*.html' | wc -l)
          echo "HTML files: $HTML_COUNT (expected at least 80)"
          if [ "$HTML_COUNT" -lt 80 ]; then
            echo "FAIL: too few HTML files — prerender may have failed"
            exit 1
          fi
          for route in products products/d15r de/products es/products fr/products; do
            if [ ! -s "dist/${route}/index.html" ]; then
              echo "FAIL: missing generated route: ${route}"
              exit 1
            fi
          done
          # The three bespoke Vue/Vite landing pages must exist in all four locales.
          for locale in en es de fr; do
            prefix=""
            if [ "$locale" != "en" ]; then prefix="$locale/"; fi
            for slug in c500-partdro-eavision vf50p-long-endurance-vtol-uav u15-multi-mission-drone; do
              route="dist/${prefix}products/${slug}/index.html"
              if [ ! -s "$route" ]; then
                echo "FAIL: missing premium landing page: $route"
                exit 1
              fi
              echo "verified $route"
            done
          done
          for artifact in _routes.json _headers _redirects; do
            if [ ! -f "dist/$artifact" ]; then
              echo "FAIL: dist/$artifact missing (cloudflare_pages preset should generate it)"
              exit 1
            fi
          done
          echo "build artifact check passed"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          # pipefail is essential: `| tee` otherwise makes the step exit with tee's
          # status (0) and hides a wrangler failure — a run can look green while
          # nothing was deployed.
          set -o pipefail
          npx wrangler pages deploy dist \
            --project-name "${{ env.CF_PROJECT_NAME }}" \
            --branch "main" \
            --commit-dirty=true 2>&1 | tee deploy.log

      - name: Report deployment URL
        if: always()
        run: |
          # Pull the *.pages.dev URL out of wrangler's own output.
          URL=$(grep -oE 'https://[a-z0-9-]+\.'${{ env.CF_PROJECT_NAME }}'\.pages\.dev' deploy.log | tail -n1 || true)
          echo "Deployment URL: ${URL:-<not found in deploy.log>}"
          if [ -n "$URL" ]; then
            echo "### Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          fi
