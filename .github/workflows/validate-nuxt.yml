name: Validate Nuxt UI and static generation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'public/**'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/validate-nuxt.yml'
  workflow_dispatch:

concurrency:
  group: validate-nuxt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Generate static site
        env:
          NITRO_PRESET: cloudflare_pages
        run: npm run generate

      - name: Verify generated routes and localized catalogue
        run: |
          set -euo pipefail
          test -s dist/index.html
          HTML_COUNT=$(find dist -type f -name '*.html' | wc -l)
          echo "Generated HTML files: ${HTML_COUNT}"
          # Current CI output is 86 HTML documents; payload JSON files account
          # for additional prerendered routes and should not inflate this count.
          if [ "${HTML_COUNT}" -lt 80 ]; then
            echo "::error::Only ${HTML_COUNT} HTML files generated; expected at least 80."
            exit 1
          fi

          for route in products products/d15r de/products es/products fr/products; do
            if [ ! -s "dist/${route}/index.html" ]; then
              echo "::error::Missing generated route: ${route}"
              exit 1
            fi
          done

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const checks = [
            ['contact', 'Contact Us'],
            ['de/contact', 'Kontaktieren Sie Uns'],
            ['es/contact', 'Contáctenos'],
            ['fr/contact', 'Contactez-Nous'],
          ]
          for (const [route, expectedTitle] of checks) {
            const html = readFileSync('dist/' + route + '/index.html', 'utf8')
            // data-edit-key attributes intentionally contain translation keys for
            // the CMS editor. Check rendered text only, not HTML attributes or scripts.
            const visibleText = html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&(?:amp|lt|gt|quot|#39);/g, ' ')
            for (const key of ['contact.title', 'contact.info.phoneValue']) {
              if (visibleText.includes(key)) {
                console.error(`::error::Raw i18n key "${key}" found in visible text on /${route}`)
                process.exit(1)
              }
            }
            if (!visibleText.includes(expectedTitle)) {
              console.error(`::error::Expected contact title "${expectedTitle}" missing from /${route}`)
              process.exit(1)
            }
            console.log(`Contact locale passed: /${route}`)
          }
          NODE
          echo "Nuxt static generation and route assertions passed."

      - name: Scan every generated page for unresolved i18n keys
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs'
          import { join, relative } from 'node:path'

          const files = []
          function walk(dir) {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) walk(path)
              else if (entry.isFile() && entry.name.endsWith('.html')) files.push(path)
            }
          }
          walk('dist')

          const unresolved = []
          const keyPattern = /\b(?:nav|hero|stats|products|cases|news|contact|about|documents|footer|topBar|meta)\.[A-Za-z][A-Za-z0-9_.]*/g
          for (const file of files) {
            const html = readFileSync(file, 'utf8')
            const visibleText = html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&(?:amp|lt|gt|quot|#39|#x20);/g, ' ')
            const matches = [...new Set(visibleText.match(keyPattern) || [])]
            if (matches.length) unresolved.push({ file: relative('dist', file), keys: matches })
          }

          if (unresolved.length) {
            for (const item of unresolved) {
              console.error('::error::Unresolved translation key(s) in ' + item.file + ': ' + item.keys.join(', '))
            }
            process.exit(1)
          }
          console.log('No unresolved translation keys found across ' + files.length + ' generated HTML pages.')
          NODE
